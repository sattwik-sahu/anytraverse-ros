[workspace]
name = "anytraverse-ros"
description = "Development environment for RoboStack ROS packages"
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[target.osx-arm64.activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"
PIP_ONLY_BINARY = ":all:"

# For activation scripts, we use bash for Unix-like systems
[target.unix.activation]
scripts = ["install/setup.bash"]
env = { "RMW_IMPLEMENTATION" = "rmw_zenoh_cpp" }

[feature.build.target.unix.tasks]
build = "colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"
cbuild = "rm -rf build/ install/ log && pixi run build"
zenohd = "ros2 run rmw_zenoh_cpp rmw_zenohd"

# Dependencies used by all environments
[dependencies]
python = ">=3.12.13,<3.15"
# Build tools
compilers = ">=2.0.0,<3"
cmake = ">=4.4.2,<5"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
ninja = ">=1.13.2,<2"
# ROS specific tools
rosdep = ">=0.26.0,<0.27"
colcon-common-extensions = ">=0.3.0,<0.4"

[target.linux.dependencies]
libgl-devel = "*"

[target.linux-64.dependencies]
libgl-devel = ">=1.7.0,<2"

# Define all the different ROS environments
# Each environment corresponds to a different ROS distribution
# and can be activated using the `pixi run/shell -e <environment>` command.
[environments]
jazzy = { features = ["jazzy", "build"] }
kilted = { features = ["kilted", "build"] }

[pypi-dependencies]
torch = ">=2.11.0, <3"
torchvision = ">=0.26.0, <0.29"
transformers = ">=5.15.1, <6"
einops = ">=0.8.2, <0.9"
accelerate = ">=1.14.0, <2"
matplotlib = ">=3.11.1, <4"
seaborn = ">=0.13.2, <0.14"
anytraverse = ">=1.0.9, <2"
pyzmq = ">=27.1.0, <28"
ormsgpack = ">=1.12.2, <2"
scipy = ">=1.18.0, <2"
ruff = ">=0.16.3, <0.17"
websockets = ">=17.0.1, <18"
rhino = { git = "https://github.com/D33panshuDR/rhino.git" }
depthai = ">=3.9.0, <4"


### ROS Jazzy ####
[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-desktop = ">=0.11.0,<0.12"
ros-jazzy-navigation2 = ">=1.3.12,<2"
ros-jazzy-nav2-costmap-2d = ">=1.3.12,<2"
ros-jazzy-nav2-bringup = ">=1.3.12,<2"
ros-jazzy-foxglove-bridge = ">=3.3.0,<4"
ros-jazzy-compressed-depth-image-transport = ">=4.0.7,<5"
ros-jazzy-compressed-image-transport = ">=4.0.7,<5"
ros-jazzy-message-filters = ">=4.11.13,<5"
ros-jazzy-rmw-zenoh-cpp = ">=0.2.9,<0.3"

### ROS Kilted ####
[feature.kilted]
channels = ["https://prefix.dev/robostack-kilted"]

[feature.kilted.dependencies]
ros-kilted-desktop = ">=0.12.0,<0.13"
ros-kilted-navigation2 = ">=1.4.2,<2"
ros-kilted-nav2-costmap-2d = ">=1.4.2,<2"
ros-kilted-nav2-bringup = ">=1.4.2,<2"
ros-kilted-foxglove-bridge = ">=3.2.4,<4"
ros-kilted-compressed-depth-image-transport = ">=5.1.1,<6"
ros-kilted-compressed-image-transport = ">=5.1.1,<6"
ros-kilted-message-filters = ">=7.1.6,<8"
ros-kilted-rmw-zenoh-cpp = ">=0.6.6,<0.7"
