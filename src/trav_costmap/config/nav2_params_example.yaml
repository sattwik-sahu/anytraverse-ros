# Example nav2_params.yaml demonstrating the TraversabilityLayer plugin
# for use in local_costmap and/or global_costmap.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true

      width: 4
      height: 4
      resolution: 0.1

      always_send_full_costmap: false

      footprint: "[[0.32, 0.15], [0.32, -0.15], [-0.32, -0.15], [-0.32, 0.15]]"

      plugins: ["traversability_layer", "inflation_layer"]

      traversability_layer:
        plugin: "custom_costmap_layers::TraversabilityLayer"
        enabled: true
        depth_topic: "/camera/depth/image_raw"
        trav_topic: "/anytraverse/trav_map"
        camera_info_topic: "/camera/depth/camera_info"
        max_distance: 5.0
        min_height: 0.05
        max_height: 1.2
        trav_threshold: 0.5
        clearing: true
        raytrace_min_range: 0.2
        raytrace_max_range: 5.0
        raytrace_stride: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 4.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.1
      footprint: "[ [0.325, 0.15], [0.325, -0.15], [-0.325, -0.15], [-0.325, 0.15] ]"
      rolling_window: true
      width: 100
      height: 100

      plugins: ["traversability_layer", "inflation_layer", "denoise_layer"]

      traversability_layer:
        plugin: "custom_costmap_layers::TraversabilityLayer"
        enabled: true
        depth_topic: "/camera/depth/image_raw"
        trav_topic: "/anytraverse/trav_map"
        camera_info_topic: "/camera/depth/camera_info"
        max_distance: 5.0
        min_height: 0.05
        max_height: 1.2
        trav_threshold: 0.5
        clearing: true
        raytrace_min_range: 0.2
        raytrace_max_range: 5.0
        raytrace_stride: 16

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 8
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
